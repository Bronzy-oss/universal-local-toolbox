# Phase 1 CI check — Android (debug build), matching the project's
# stated platform priority: Android first, desktop later (Phase 7).
#
# Scope on purpose: this only proves `tauri android build --debug`
# succeeds and produces an unsigned debug APK for one architecture
# (aarch64 — what almost every real phone, including the dev's own
# Oppo A5x, actually uses). Release signing, multi-ABI builds, and
# Play Store distribution are separate, later concerns.
name: Android Build Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build (Android, debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # No `cache: npm` yet — that option requires a package-lock.json
          # to key the cache on, and none exists yet (npm install has never
          # run, since the dev sandbox has no network access). Once a
          # package-lock.json is committed after the first successful
          # `npm install`, add `cache: npm` back here to speed up future runs.

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Export NDK_HOME
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Initialize Android project
        run: npx tauri android init

      # This is the step that actually makes a custom app icon show up
      # on Android. Editing src-tauri/icons/*.png by hand (what earlier
      # steps did) only affects the *desktop* bundle — Android's launcher
      # icon lives under src-tauri/gen/android/.../mipmap-*/, a folder
      # that's regenerated fresh by `android init` above and is not
      # committed to git. `tauri icon` is the official generator that
      # derives every platform's icon (desktop AND Android/iOS mipmaps)
      # from one master source image, run after init so gen/android
      # already exists for it to populate.
      - name: Generate all platform icons from source
        run: npx tauri icon src-tauri/icon-source.png

      - name: Build Android (debug APK, aarch64 only)
        run: npx tauri android build --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-local-toolbox-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
